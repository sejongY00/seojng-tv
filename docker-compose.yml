services:
  app:
    build: .
    container_name: sejong-tv
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/sejong.db
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    volumes:
      - sqlite_data:/app/data
    ports:
      - "3000:3000"
    # NPM Plus와 같은 Docker 네트워크에 붙이려면:
    # 1) ports 섹션을 주석 처리하고
    # 2) 아래 networks를 활성화한 뒤
    # 3) external 네트워크 이름을 실제 NPM Plus 네트워크로 맞추세요.
    # networks:
    #   - npmplus

volumes:
  sqlite_data:

